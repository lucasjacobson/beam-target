name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run still going for the older one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The version used locally, so that formatting does not change with ruff releases
      - run: python -m pip install ruff==0.17.4
      - run: ruff format --check .
      - run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # The whole history and tags, for the version (setuptools-scm)
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # A regular (not editable) install, so the tests use the package as users get it,
      # data files included
      - run: python -m pip install ".[dev]"
      - name: Show the installed version
        run: python -c "import beamtarget; print(beamtarget.__version__, beamtarget.__file__)"
      # Every test (-m ""), against the installed package (no src on the path). MCNP and
      # OpenMC are not installed here, so the tests that need them skip themselves, as do
      # those needing full nuclear-data libraries.
      - run: python -m pytest -m "" -o pythonpath= -rs
