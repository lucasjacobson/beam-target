[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beam-target"
version = "0.1.0"
description = "Neutron source terms for beam-target neutron generators, for MCNP and OpenMC"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lucas Jacobson" }]
dependencies = ["numpy", "h5py", "matplotlib", "numba"]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[project.scripts]
beam-target = "beamtarget.cli:main"

[tool.setuptools.package-data]
beamtarget = ["data/*", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
# pycodestyle errors/warnings (PEP 8), pyflakes, import sorting
select = ["E", "W", "F", "I"]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 100; allow up to 120 for lines it can't break (long comments)
max-line-length = 120
