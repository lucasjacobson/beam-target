[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "beam-target"
# The version comes from the git tags (setuptools-scm): "0.1.0" at the tag v0.1.0, and
# "0.1.1.dev5+g1234abc" five commits after it, at commit 1234abc
dynamic = ["version"]
description = "Fast, deterministic neutron source terms for light ion beams in gas and solid targets, for MCNP and OpenMC"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lucas Jacobson" }]
dependencies = ["numpy", "h5py", "matplotlib", "numba"]

[project.urls]
Repository = "https://github.com/lucasjacobson/beam-target"

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-xdist"]

[project.scripts]
beam-target = "beamtarget.cli:main"

[tool.setuptools_scm]
# Without git history (such as an unpacked source archive), the version is unknown
fallback_version = "0+unknown"

[tool.setuptools.package-data]
beamtarget = ["data/*", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# In parallel (pytest-xdist; worksteal measured fastest), and without the slow tests (MCNP and
# OpenMC sampling, convergence, regression) unless asked: pytest -m slow for those alone,
# pytest -m "" for everything, and pytest -n 0 for one process
addopts = "-n auto --dist worksteal -m 'not slow'"
markers = ["slow: long-running checks, skipped unless selected with -m slow or -m \"\""]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
# pycodestyle errors/warnings (PEP 8), pyflakes, import sorting
select = ["E", "W", "F", "I"]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 100; allow up to 120 for lines it can't break (long comments)
max-line-length = 120
