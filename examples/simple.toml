# A simple input file: one case, a deuteron beam into a target chamber of 90% tritium D/T
# gas, with the pressure and current given. It uses every setting that can be given together;
# beam, stopping_power, and beam_direction are set to their defaults, to show them. Left out, as
# alternatives to what is given here: yield_total (instead of beam_current), beam_energy_backstop
# (to calculate a length, pressure, or density instead), density (instead of pressure and
# temperature), entry_position (instead of backstop_position), and atoms with density for a
# solid material. See examples/generic.toml for those.
#
# Run with:  python -m beamtarget examples/simple.toml

[materials.DT90]
phase     = "gas"
molecules = { D2 = 0.1, T2 = 0.9 }  # mole fractions of the molecules

[regions.chamber]
material          = "DT90"
length            = 137.0   # cm
pressure          = 38.0    # torr
temperature       = 1800.0  # degC
wall_radius       = 4.1783  # cm
divergence        = 36.0    # mrad
position_bins     = 137     # position bins
# position_substeps = 10     # steps the beam is followed in across each bin (default 10)

[cases.DT90]
# Beam particle: "proton" or "1H", "deuteron" or "2H", "triton" or "3H", "helion" or "3He",
# "alpha" or "4He"
beam                = "deuteron"
regions             = ["chamber"]
beam_energy_entry   = 280.0   # keV
beam_current        = 50.0    # mA
beam_radius_entry   = 0.2     # cm, beam radius at entry
angle_bin_width     = 3.0     # deg, output
energy_bin_width    = 0.01    # MeV, output
stopping_power      = "srim"  # "srim" (SRIM-2012.01) or "icru49" (ICRU Report 49 electronic)
beam_direction      = "-z"    # beam direction in MCNP and OpenMC: -x, +x, -y, +y, -z, or +z
backstop_position   = [0.0, 0.0, 0.0]  # cm, where the beam reaches the backstop
