# Example cases for beam-target, one for each feature of the code.
#
# Run with:  python -m beamtarget examples/generic.toml
# One case:  python -m beamtarget examples/generic.toml -c DT50
#
# Each case lists the regions the beam passes through, in order, in regions = [...]: names
# of [regions.<name>] tables, or inline tables. An inline table can start from a named region
# with use = "<name>" and change some of its settings; setting = false leaves one of them
# out. Each region holds a material from a [materials.<name>] table and has its own length,
# wall radius, divergence, and position mesh; a gas region also has its state, pressure with
# temperature or density. The last region ends at the backstop.
#
# Leave exactly one value to be calculated: the beam energy at the backstop, or (giving
# beam_energy_backstop) one region's length, pressure (keeping its temperature) or density.
# Likewise give either the beam current or the total neutron yield (yield_total), and the
# other is calculated.
#
# Values with units are written with them, such as "300 keV": energies in eV, keV, MeV, or
# GeV; currents in A, mA, uA, or nA; pressures in Pa, kPa, torr, mtorr, mbar, bar, atm, or psi;
# temperatures in K, degC (or C), or degF (or F); angles (divergence, angle_bin_width) in rad,
# mrad, urad, or deg; lengths, radii, and positions in m, cm, mm, um, nm, in, or ft; densities in
# g/cm3, kg/m3, or g/L. Only yield_total (n/s) and counts are plain numbers. A case's results are
# in the units it uses (the first one, where it uses several for one kind of value, such as
# lengths along the beam or radii); emission angles are always in degrees, and the MCNP SDEF in
# cm and MeV.
#
# Settings in [defaults] apply to every case unless the case sets them itself. Here they hold
# a deuteron beam into a 50/50 D/T gas target chamber, and each case changes only what it
# demonstrates.

[defaults]
# Beam particle: "proton" or "1H", "deuteron" or "2H", "triton" or "3H", "helion" or "3He",
# "alpha" or "4He"
beam              = "deuteron"
regions           = ["chamber"]
beam_energy_entry = "300 keV"
beam_current      = "50 mA"
beam_radius_entry = "0.2 cm"  # beam radius where it enters the first region

# Angle and energy mesh (the position mesh belongs to each region)
angle_bin_width   = "3 deg"  # "180 deg" gives an isotropic source
energy_bin_width  = "0.01 MeV"

# MCNP SDEF card: where the source goes in the MCNP geometry. Place it by where the beam
# reaches the backstop (backstop_position) or where it enters the first region
# (entry_position); a case may set either. Here the backstop is at the origin, whatever the
# case's length (even a calculated one).
beam_direction    = "-z"             # beam direction: -x, +x, -y, +y, -z, or +z
backstop_position = ["0 cm", "0 cm", "0 cm"]

# Physics
stopping_power = "srim"  # "srim" (SRIM-2012.01) or "icru49" (ICRU Report 49 electronic)
# Nuclear-data libraries, searched in order for each target isotope: "drosg" (the built-in
# D(d,n), T(d,n), T(p,n) and 7Li(p,n) reactions), names of libraries defined in your
# ~/.beam-target.toml, such as ["drosg", "endfb81", "fendl32c", "tendl2025"], or
# directories (relative to this file). See src/beamtarget/data/README.md.
nuclear_data = ["drosg"]

# --- Materials -------------------------------------------------------------------------------
# A gas gives its molecules (mole fractions): its pressure counts molecules, so H2O vapor,
# H2 + O2, and atomic H and O are different gases. A solid gives its atoms (atom ratios) and
# its mass density. An element symbol means the natural element (Li is 92.4% 7Li, H holds a
# little D); write one isotope with its mass number first (7Li, 3He). D and T are 2H and 3H.

[materials.D2]
phase     = "gas"
molecules = { D2 = 1.0 }

[materials.T2]
phase     = "gas"
molecules = { T2 = 1.0 }

[materials.DT50]
phase     = "gas"
molecules = { D2 = 0.5, T2 = 0.5 }  # DT molecules would give the same atoms

# Illustrative values
[materials.DT_argon]
phase     = "gas"
molecules = { D2 = 0.49, T2 = 0.49, Ar = 0.02 }

[materials."TiD1.5"]
phase   = "solid"
density = "3.9 g/cm3"
atoms   = { Ti = 1.0, D = 1.5 }

[materials.Li]
phase   = "solid"
density = "0.534 g/cm3"
atoms   = { Li = 1.0 }  # Natural lithium

[materials.Be]
phase   = "solid"
density = "1.848 g/cm3"
atoms   = { Be = 1.0 }

# --- Regions ---------------------------------------------------------------------------------

# The target chamber: 50/50 D/T gas at 57 torr and 1800 degC, which leaves the beam with about
# 10 keV at the backstop
[regions.chamber]
material          = "DT50"
length            = "100 cm"
pressure          = "57 torr"
temperature       = "1800 degC"
wall_radius       = "4 cm"  # the beam outside it is scraped off (leave it out: no wall)
divergence        = "36 mrad"
position_bins     = 100     # 1 cm each
position_substeps = 10      # steps the beam is followed in across each bin (10 is the default)

# Two differential-pumping stages in front of the chamber (illustrative values)
[regions.stage1]
material          = "DT50"
length            = "50 cm"
pressure          = "0.05 torr"
temperature       = "25 degC"
wall_radius       = "1 cm"
position_bins     = 1

[regions.stage2]
material          = "DT50"
length            = "50 cm"
pressure          = "0.5 torr"
temperature       = "25 degC"
wall_radius       = "1 cm"
position_bins     = 1

# A 1 cm aperture with a 2 cm radius inside the chamber gas (illustrative)
[regions.aperture]
material          = "DT50"
length            = "1 cm"
pressure          = "57 torr"
temperature       = "1800 degC"
wall_radius       = "2 cm"
divergence        = "36 mrad"
position_bins     = 1

# A titanium deuteride film 5 micrometers thick. Divergence means nothing over micrometers,
# so it is left at its default of 0 (a constant beam radius).
[regions.TiD_film]
material          = "TiD1.5"
length            = "5 um"  # with a unit: this case's lengths are reported in um
wall_radius       = "4 cm"
position_bins     = 100

# A lithium metal film 10 micrometers thick
[regions.Li_film]
material          = "Li"
length            = "10 um"
wall_radius       = "4 cm"
position_bins     = 100

# --- Gas mixtures ----------------------------------------------------------------------------

# Pure deuterium: DD neutrons only
[cases.DD]
regions = [{ use = "chamber", material = "D2" }]

# Pure tritium: DT neutrons only
[cases.DT]
regions = [{ use = "chamber", material = "T2" }]

# 50/50 D/T: everything from [defaults]. The DT50_ cases below change one thing each.
[cases.DT50]

# 50/50 D/T with 2% argon (by molecule): same pressure, fewer D and T atoms, more stopping
[cases.DT50_argon]
regions = [{ use = "chamber", material = "DT_argon" }]

# The same gas as DT50 given by its density (that of 57 torr at 1800 degC) instead of its
# pressure and temperature: the same results
[cases.DT50_by_density]
regions = [{ use = "chamber", pressure = false, temperature = false, density = "2.217655e-6 g/cm3" }]

# --- Solid targets ---------------------------------------------------------------------------

# The beam stops in about 2 micrometers of the film
[cases.TiD_thick]
regions      = ["TiD_film"]
beam_current = "1 mA"

# The film thickness that leaves the beam with 100 keV
[cases.TiD_find_thickness]
regions              = [{ use = "TiD_film", length = false }]
beam_energy_backstop = "100 keV"
beam_current         = "1 mA"

# --- Other beams -----------------------------------------------------------------------------

# 2.5 MeV protons through the lithium film: 7Li(p,n)7Be neutrons, to the 7Be ground state
# (n0) and its first excited state (n1). Up to 3.70 MeV, where 7Li(p,n3He)4He opens.
[cases.p_Li_thin]
beam              = "proton"
beam_energy_entry = "2.5 MeV"
beam_current      = "1 mA"
regions           = ["Li_film"]

# Tritons into deuterium gas: D(t,n)4He, the DT reaction seen from the other side
[cases.t_D2]
beam    = "triton"
regions = [{ use = "chamber", material = "D2" }]

# 18 MeV protons stopping in beryllium, from evaluated data: every 9Be(p,xn) channel, from
# the ENDF/B-VIII.1 file kept with the tests (point nuclear_data at a full library instead).
# The spectrum runs from 0 to 16 MeV, so 0.1 MeV energy bins; the beam loses its energy fast,
# so 20 steps per position bin keep the 9Be(p,n) lines from making stripes in the spectrum.
[cases.p_Be_thick]
beam              = "proton"
beam_energy_entry = "18 MeV"
beam_current      = "0.1 mA"
energy_bin_width  = "0.1 MeV"
nuclear_data      = ["drosg", "../tests/data/endf/ENDF-B-VIII.1"]
regions           = [
    { material = "Be", length = "0.5 cm", wall_radius = "4 cm", position_bins = 50, position_substeps = 20 },
]

# --- Physics ---------------------------------------------------------------------------------

# ICRU 49 electronic stopping instead of SRIM
[cases.DT50_icru49]
stopping_power = "icru49"

# A denser target: the beam stops about 90 cm in, so no beam power reaches the backstop
[cases.DT50_beam_stops]
regions = [{ use = "chamber", pressure = "70 torr" }]

# --- Calculated settings ---------------------------------------------------------------------

# Calculate the chamber length that leaves the beam with 30 keV at the backstop
[cases.DT50_find_length]
regions              = [{ use = "chamber", length = false }]
beam_energy_backstop = "30 keV"

# Calculate the pressure instead (no pressure, but a temperature), for the same backstop
# energy
[cases.DT50_find_pressure]
regions              = [{ use = "chamber", pressure = false }]
beam_energy_backstop = "30 keV"

# Calculate the beam current that gives a total neutron yield of 1e13 n/s
[cases.DT50_find_current]
yield_total = 1e13  # n/s

# --- Geometry and MCNP output ----------------------------------------------------------------

# Pumping stages in front of the chamber, with the beam traveling along +x from x = -100 cm
# (entry_position set in the case replaces backstop_position from [defaults])
[cases.DT50_upstream]
regions        = ["stage1", "stage2", "chamber"]
beam_direction = "+x"
entry_position = ["-100 cm", "0 cm", "0 cm"]

# A narrower aperture halfway along the chamber scrapes the beam there (each region has its
# own wall radius)
[cases.DT50_aperture]
regions = [
    { use = "chamber", length = "49.5 cm", position_bins = 50 },
    "aperture",
    { use = "chamber", length = "49.5 cm", position_bins = 50 },
]

# No divergence (a constant beam radius, so no scraping) and one output angle bin (an
# isotropic source)
[cases.DT50_isotropic]
regions             = [{ use = "chamber", divergence = "0 mrad" }]
angle_bin_width     = "180 deg"
