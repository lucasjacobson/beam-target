# Generic beam-target cases for shine_neutron_source.
#
# Run with:  python -m shine_neutron_source examples/generic.toml
#
# Settings in [defaults] apply to every case unless the case sets them itself. Every case
# needs all of the settings below, either directly or from [defaults].
#
# Of the target chamber's pressure and length and the beam energy at the backstop, give any
# two and the third is calculated. These cases give pressure and length; to calculate the
# length instead, replace it with, for example:
#
#   beam_energy_backstop = 30.0  # keV, beam energy at the end of the target chamber
#
# Likewise give either the beam current or the total neutron yield, and the other is
# calculated. To calculate the current, replace it with, for example:
#
#   yield_total = 1e13  # n/s
#
# A case can put gas regions in front of the target chamber (for example differential-
# pumping stages) by naming an [upstream.<name>] table:
#
#   [upstream.example]
#   pressure       = [1e-3, 1e-2]  # torr, one per stage, in beam order
#   length         = [50.0, 50.0]  # cm
#   num_x_bins     = 10            # optional (default 10): internal bins per stage
#   num_x_bins_out = 1             # optional (default 1): output bins per stage
#   divergence     = 0.0           # optional (default 0): mrad
#
#   [cases.with_upstream]
#   upstream = "example"
#   ...

[defaults]
# Mesh. Memory use is roughly 2.5 GB per case at these settings.
num_x_bins       = 1370  # position bins in the target chamber, internal calculation
num_x_bins_out   = 137   # position bins in the target chamber, output
angle_step       = 0.01  # deg, internal calculation
angle_step_out   = 3.0   # deg, output (180 gives an isotropic source)
energy_bin_width = 0.01  # MeV, width of the output neutron energy bins

# MCNP SDEF card: where the source goes in the MCNP geometry
direction      = "-z"             # beam direction: -x, +x, -y, +y, -z or +z
entry_position = [0.0, 0.0, 0.0]  # cm, where the beam enters the first gas region

# Physics
stopping_power = "srim"  # "srim" (SRIM-2012.01) or "icru49" (ICRU Report 49 electronic)

# Cases are named by the tritium fraction of the gas

[cases.T000pct]
T_frac       = 0.0       # atom fraction of tritium in the gas
voltage      = 280.0     # kV
current      = 50.0      # mA
pressure     = 38.0      # torr, target chamber
temperature  = 1800.0    # degC
length       = 137.0     # cm, target chamber
start_radius = 0.2       # cm, beam radius at entry
wall_radius  = 4.1783    # cm, target chamber wall
divergence   = 36.0      # mrad

[cases.T001pct]
T_frac       = 0.01
voltage      = 280.0
current      = 50.0
pressure     = 38.0
temperature  = 1800.0
length       = 137.0
start_radius = 0.2
wall_radius  = 4.1783
divergence   = 36.0

