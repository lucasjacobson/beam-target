<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neutron energy surfaces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #001027;
    --paper: #FFFFFF;
    --paper-tint: #F0F7FA;
    --dark-blue: #0093FF;
    --gray-light: #CCCCCC;
    --gray: #888B8D;
    --gray-dark: #53565A;
    --font: "Red Hat Display", "Aptos", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: var(--font); }
  body { display: flex; flex-direction: row; }
  #panel {
    width: 300px; flex: none; padding: 20px 18px; overflow-y: auto;
    border-right: 1px solid var(--gray-light); background: var(--paper);
  }
  #panel h1 { font-size: 1.15rem; font-weight: 600; line-height: 1.3; margin: 0 0 4px; }
  #panel .case { color: var(--gray-dark); font-size: 0.85rem; margin-bottom: 18px; }
  .label { font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gray-dark); margin: 18px 0 8px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 0.9rem; }
  .row > span:first-child { width: 92px; flex: none; }
  .row input[type=range] { flex: 1; min-width: 0; accent-color: var(--dark-blue); }
  .row output { width: 44px; text-align: right; font-variant-numeric: tabular-nums; color: var(--gray-dark); }
  select { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--gray-light); border-radius: 6px; background: var(--paper); color: var(--ink); }
  input[type=checkbox] { accent-color: var(--dark-blue); }
  .buttons { display: flex; gap: 8px; margin-top: 18px; }
  button {
    flex: 1; font: inherit; font-size: 0.9rem; padding: 7px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--dark-blue); background: var(--paper); color: var(--dark-blue);
  }
  button:hover { background: var(--paper-tint); }
  .hint { font-size: 0.8rem; color: var(--gray-dark); margin-top: 18px; line-height: 1.45; }
  #view { position: relative; flex: 1; min-width: 0; }
  #view canvas { display: block; }
  #readout {
    position: absolute; left: 16px; top: 12px; font-size: 0.85rem; padding: 6px 10px; border-radius: 6px;
    background: rgba(255,255,255,0.88); border: 1px solid var(--gray-light); pointer-events: none;
    font-variant-numeric: tabular-nums; display: none;
  }
  #colorbar { position: absolute; right: 22px; top: 50%; transform: translateY(-50%); display: flex; gap: 6px; align-items: stretch; height: 46%; pointer-events: none; }
  #colorbar canvas { width: 16px; height: 100%; border: 1px solid var(--gray-light); }
  #colorbar .ticks { display: flex; flex-direction: column; justify-content: space-between; font-size: 0.75rem; color: var(--gray-dark); }
  #colorbar .unit { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 0.75rem; color: var(--gray-dark); text-align: center; }
  .tick { font-size: 12px; color: var(--gray-dark); white-space: nowrap; }
  .axis { font-size: 13px; color: var(--ink); white-space: nowrap; }
  #error { padding: 24px; display: none; }
  @media (max-width: 760px) {
    body { flex-direction: column; }
    #panel { width: 100%; border-right: none; border-bottom: 1px solid var(--gray-light); max-height: 45vh; padding: 14px 16px; }
    #view { min-height: 55vh; }
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="panel">
  <h1 id="title"></h1>
  <div class="case" id="case"></div>

  <div id="reaction-block">
    <div class="label">Reaction</div>
    <select id="reaction"></select>
  </div>

  <div class="label">Colors</div>
  <select id="colormap"></select>

  <div class="label">Light</div>
  <div class="row"><span>Direction</span><input id="azimuth" type="range" min="-180" max="180" step="1"><output id="azimuth-out"></output></div>
  <div class="row"><span>Height</span><input id="elevation" type="range" min="5" max="85" step="1"><output id="elevation-out"></output></div>
  <div class="row"><span>Fill light</span><input id="ambient" type="range" min="0" max="1" step="0.01"><output id="ambient-out"></output></div>
  <div class="row"><span>Gloss</span><input id="gloss" type="range" min="0" max="1" step="0.01"><output id="gloss-out"></output></div>
  <div class="row"><label><input id="shadows" type="checkbox" checked> Cast shadows</label></div>

  <div class="label">Shape</div>
  <div class="row"><span>Vertical scale</span><input id="vscale" type="range" min="0.2" max="2" step="0.05"><output id="vscale-out"></output></div>
  <div class="row"><label><input id="floor" type="checkbox" checked> Floor and grid</label></div>

  <div class="buttons"><button id="reset">Reset view</button><button id="save">Save PNG</button></div>
  <div class="hint">Drag to turn, right-drag to move, scroll to zoom. Point at the surface to read a value.</div>
</div>
<div id="view">
  <div id="readout"></div>
  <div id="colorbar"><div class="unit" id="cb-unit"></div><div class="ticks" id="cb-ticks"></div><canvas id="cb" width="1" height="256"></canvas></div>
  <div id="error">This page needs WebGL and an internet connection the first time (it loads three.js from cdn.jsdelivr.net).</div>
</div>
<script id="surface-data" type="application/json">/*DATA*/</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

const DATA = JSON.parse(document.getElementById("surface-data").textContent);
const BOX = { x: 4, z: 4, y: 3 };  // The plot box, as matplotlib's (angle, energy, height)
const DEFAULTS = { azimuth: -60, elevation: 25, ambient: 0.35, gloss: 0.3, vscale: 1, colormap: DATA.default_colormap };
const view = document.getElementById("view");

// ----- Renderer, scene, camera ---------------------------------------------------------------
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
} catch (e) {
  document.getElementById("error").style.display = "block";
  throw e;
}
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0xffffff);
view.appendChild(renderer.domElement);
const labels = new CSS2DRenderer();
labels.domElement.style.position = "absolute";
labels.domElement.style.top = "0";
labels.domElement.style.pointerEvents = "none";
view.appendChild(labels.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
function resetView() {
  camera.position.set(7.2, 6.0, 8.6);
  controls.target.set(0, 0.9, 0);
  controls.update();
}
resetView();

const ambient = new THREE.AmbientLight(0xffffff, 1);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.1, far: 30 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.015;
sun.shadow.radius = 3;
scene.add(sun, sun.target);

// ----- Colormaps ------------------------------------------------------------------------------
const cmapSelect = document.getElementById("colormap");
for (const name of Object.keys(DATA.colormaps)) cmapSelect.add(new Option(name, name));
function colormapTexture(name) {
  const rgb = DATA.colormaps[name];
  const pixels = new Uint8Array(rgb.length * 4);
  rgb.forEach((c, i) => pixels.set([c[0], c[1], c[2], 255], 4 * i));
  const texture = new THREE.DataTexture(pixels, rgb.length, 1, THREE.RGBAFormat);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.magFilter = texture.minFilter = THREE.LinearFilter;
  texture.needsUpdate = true;
  return texture;
}
function drawColorbar(name) {
  const rgb = DATA.colormaps[name];
  const canvas = document.getElementById("cb");
  canvas.height = rgb.length;
  const ctx = canvas.getContext("2d");
  rgb.forEach((c, i) => { ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`; ctx.fillRect(0, rgb.length - 1 - i, 1, 1); });
}

// ----- Surface --------------------------------------------------------------------------------
const material = new THREE.MeshPhongMaterial({ side: THREE.DoubleSide, shininess: 18 });
let surface = null, current = null;
const box = new THREE.Group();
scene.add(box);

function xOf(angle) { return -BOX.x / 2 + BOX.x * angle / 180; }
function zOf(energy, r) { return -BOX.z / 2 + BOX.z * (energy - r.e0) / (r.e1 - r.e0 || 1); }

function buildSurface(r) {
  const nA = r.angles.length, nE = r.energies.length;
  const positions = new Float32Array(nA * nE * 3), uvs = new Float32Array(nA * nE * 2);
  for (let i = 0; i < nA; i++) for (let j = 0; j < nE; j++) {
    const k = i * nE + j, h = r.heights[k];
    positions.set([xOf(r.angles[i]), h * BOX.y, zOf(r.energies[j], r)], 3 * k);
    uvs.set([0.002 + 0.996 * h, 0.5], 2 * k);
  }
  const index = [];
  for (let i = 0; i + 1 < nA; i++) for (let j = 0; j + 1 < nE; j++) {
    const a = i * nE + j, b = a + 1, c = a + nE, d = c + 1;
    if (r.heights[a] + r.heights[b] + r.heights[c] + r.heights[d] === 0) continue;  // Transparent
    index.push(a, c, b, b, c, d);
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute("uv", new THREE.BufferAttribute(uvs, 2));
  geometry.setIndex(index);
  geometry.computeVertexNormals();
  return geometry;
}

// ----- Box, grid, and labels ------------------------------------------------------------------
function niceTicks(lo, hi, count) {
  const raw = (hi - lo) / count, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  const ticks = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9 * step; v += step) ticks.push(+v.toPrecision(12));
  return ticks;
}
function label(text, cls, position) {
  const div = document.createElement("div");
  div.className = cls;
  div.innerHTML = text;
  const object = new CSS2DObject(div);
  object.position.copy(position);
  return object;
}
function formatValue(v) {
  if (v === 0) return "0";
  const e = Math.floor(Math.log10(Math.abs(v)));
  if (e >= -2 && e < 4) return +v.toPrecision(4) + "";
  return +(v / Math.pow(10, e)).toPrecision(3) + "&times;10<sup>" + e + "</sup>";
}
function buildBox(r, vscale) {
  box.clear();
  const top = BOX.y * vscale, x0 = -BOX.x / 2, x1 = BOX.x / 2, z0 = -BOX.z / 2, z1 = BOX.z / 2;
  const lines = [];
  const seg = (a, b) => lines.push(...a, ...b);
  const angleTicks = [0, 30, 60, 90, 120, 150, 180];
  const energyTicks = niceTicks(r.e0, r.e1, 7).filter(e => e >= r.e0 && e <= r.e1);
  const valueTicks = niceTicks(0, r.max, 5).filter(v => v <= r.max);
  for (const a of angleTicks) { seg([xOf(a), 0, z0], [xOf(a), 0, z1]); seg([xOf(a), 0, z0], [xOf(a), top, z0]); }
  for (const e of energyTicks) { seg([x0, 0, zOf(e, r)], [x1, 0, zOf(e, r)]); seg([x0, 0, zOf(e, r)], [x0, top, zOf(e, r)]); }
  for (const v of valueTicks) { const y = top * v / r.max; seg([x0, y, z0], [x1, y, z0]); seg([x0, y, z0], [x0, y, z1]); }
  const grid = new THREE.LineSegments(
    new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(lines, 3)),
    new THREE.LineBasicMaterial({ color: 0xcccccc }));
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(BOX.x, BOX.z), new THREE.MeshPhongMaterial({ color: 0xf7f7f7, shininess: 0 }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.001;
  floor.receiveShadow = true;
  const walls = new THREE.Group();
  walls.add(grid, floor);
  walls.visible = document.getElementById("floor").checked;
  box.add(walls);
  const edge = 0.18;
  for (const a of angleTicks) box.add(label(a + "", "tick", new THREE.Vector3(xOf(a), 0, z1 + edge)));
  for (const e of energyTicks) box.add(label(+e.toPrecision(6) + "", "tick", new THREE.Vector3(x1 + edge, 0, zOf(e, r))));
  for (const v of valueTicks) box.add(label(formatValue(v), "tick", new THREE.Vector3(x1 + edge, top * v / r.max, z0)));
  box.add(label("Emission angle [degrees]", "axis", new THREE.Vector3(0, 0, z1 + 0.6)));
  box.add(label(`Neutron energy [${r.unit}]`, "axis", new THREE.Vector3(x1 + 0.75, 0, 0)));
  box.add(label(`Neutrons [n/(${r.unit}&middot;s&middot;sr)]`, "axis", new THREE.Vector3(x1 + 0.5, top + 0.35, z0)));
  box.userData.walls = walls;
}

// ----- State and controls ---------------------------------------------------------------------
const reactionSelect = document.getElementById("reaction");
DATA.reactions.forEach((r, i) => reactionSelect.add(new Option(r.label_text, i)));
document.getElementById("reaction-block").style.display = DATA.reactions.length > 1 ? "" : "none";
document.getElementById("case").textContent = DATA.name;

function setReaction(i) {
  current = DATA.reactions[i];
  current.e0 = current.energies[0];
  current.e1 = current.energies[current.energies.length - 1];
  document.getElementById("title").innerHTML = current.label_html + " neutron energy against emission angle";
  if (surface) { scene.remove(surface); surface.geometry.dispose(); }
  surface = new THREE.Mesh(buildSurface(current), material);
  surface.castShadow = surface.receiveShadow = true;
  scene.add(surface);
  update();
}

const inputs = ["azimuth", "elevation", "ambient", "gloss", "vscale"].map(id => document.getElementById(id));
function update() {
  const [az, el, amb, gloss, vscale] = inputs.map(input => +input.value);
  inputs.forEach(input => document.getElementById(input.id + "-out").textContent =
    input.id === "azimuth" || input.id === "elevation" ? input.value + "°" : (+input.value).toFixed(2));
  // Light: a direction around the vertical (azimuth, from the energy axis) and above the floor
  const a = THREE.MathUtils.degToRad(az), e = THREE.MathUtils.degToRad(el);
  sun.position.set(10 * Math.cos(e) * Math.sin(a), 10 * Math.sin(e), 10 * Math.cos(e) * Math.cos(a));
  sun.intensity = Math.PI * (1 - amb) * 1.15;
  ambient.intensity = Math.PI * amb;
  material.specular.setScalar(gloss * 0.6);
  sun.castShadow = document.getElementById("shadows").checked;
  surface.scale.y = vscale;
  buildBox(current, vscale);
}
inputs.forEach(input => input.addEventListener("input", update));
["shadows", "floor"].forEach(id => document.getElementById(id).addEventListener("change", update));
reactionSelect.addEventListener("change", () => setReaction(+reactionSelect.value));
function setColormap(name) {
  if (material.map) material.map.dispose();
  material.map = colormapTexture(name);
  material.needsUpdate = true;
  drawColorbar(name);
}
cmapSelect.addEventListener("change", () => setColormap(cmapSelect.value));
document.getElementById("reset").addEventListener("click", resetView);
document.getElementById("save").addEventListener("click", () => {
  const link = document.createElement("a");
  link.download = `${DATA.name}_${DATA.reactions[+reactionSelect.value].key}_surface.png`;
  link.href = renderer.domElement.toDataURL("image/png");
  link.click();
});

for (const [id, value] of Object.entries(DEFAULTS)) {
  const element = document.getElementById(id);
  if (element) element.value = value;
}
setColormap(DEFAULTS.colormap);
setReaction(0);

// ----- Colorbar ticks, readout ----------------------------------------------------------------
function colorbarTicks() {
  const ticks = niceTicks(0, current.max, 5).filter(v => v <= current.max);
  const div = document.getElementById("cb-ticks");
  div.style.justifyContent = "flex-start";
  div.style.position = "relative";
  div.innerHTML = "";
  for (const v of ticks) {
    const t = document.createElement("div");
    t.innerHTML = formatValue(v);
    t.style.position = "absolute";
    t.style.right = "0";
    t.style.bottom = `calc(${100 * v / current.max}% - 0.5em)`;
    div.appendChild(t);
  }
  div.style.width = "64px";
  document.getElementById("cb-unit").innerHTML = `n/(${current.unit}&middot;s&middot;sr)`;
}
reactionSelect.addEventListener("change", colorbarTicks);
colorbarTicks();

const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
const readout = document.getElementById("readout");
renderer.domElement.addEventListener("pointermove", event => {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.set(((event.clientX - rect.left) / rect.width) * 2 - 1, -((event.clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObject(surface)[0];
  if (!hit) { readout.style.display = "none"; return; }
  const p = hit.point, r = current;
  const angle = (p.x + BOX.x / 2) / BOX.x * 180;
  const energy = r.e0 + (p.z + BOX.z / 2) / BOX.z * (r.e1 - r.e0);
  const value = p.y / (BOX.y * surface.scale.y) * r.max;
  readout.innerHTML = `${angle.toFixed(1)}&deg;, ${+energy.toPrecision(4)} ${r.unit}: ${formatValue(value)} n/(${r.unit}&middot;s&middot;sr)`;
  readout.style.display = "block";
});
renderer.domElement.addEventListener("pointerleave", () => { readout.style.display = "none"; });

// ----- Size and render loop -------------------------------------------------------------------
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h);
  labels.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);
resize();
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
  labels.render(scene, camera);
});
window.surfaceViewReady = true;
</script>
</body>
</html>
